<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sambak OG Green · Tapak.</title>
<style>
    :root{
        --paper:#f6f6f2;

    }
    body {
        background: var(--paper);
        margin: 0;
        padding: 24px;
        box-sizing: border-box ;
        min-height: 100vh;
        background: var(--paper);
        font-family: Arial, Helvetica, sans-serif;

        display: flex;
        justify-content: center;
        align-items: center;
    }

    

    .size {
        display: grid;
        grid-template-columns: repeat(5,1fr);
        gap: 8px;
        position: relative;
        cursor: pointer;
    }

    .size input{
        position: absolute;
        width: 1px;
        height: 1px;
        clip-path: inset(50%);
    }

    .size span {
        display: block;
        padding: 12px 0;
        text-align: center;
        border: 1px solid #cfd3cd;
        border-radius: 8px;
        background: white;
        color: #181b19;
    }

    .size input:checked + span {
        background: #181b19;
        color: white;
        border-color: #181b19;
    }

    .size input:focus-visible + span {
        outline: 3px solid #284aab;
        outline-offset: 2px;
    }
    .add-button {
        color: white;
        background: #111;
        width: 100%;
        margin-top: 16px;
        border: 0;
        border-radius: 8px;
        font: inherit;
        font-weight: bold;
        cursor: pointer;
        transition: background-color 0.2s ease;
    }

    .add-button:hover {
        background-color: #333;
    }

    main {
        width: 100%;
        max-width: 520px;
    }

    .product-card {
        background: white;
        padding: 24px;
        border-radius: 18px;
        box-shadow:0 0px 20px rgba(0,0,0,0.00)
    }

    .product-image {
        display: block;
        width: 100%;
        height: 300px;
        object-fit: cover;
        object-position: center 40%;
        border-radius: 12px;
        margin-bottom: 20px;
    }

    .brand {
        margin: 0 0 0px;
        color : #284aab;
        font-size: 12px;
        font-weight: bold;
        letter-spacing: 2px;
    }
    h1 {
        margin: 0 0 12px;
        color:#181b19;
        font-size: 32px;
        line-height: 1.15;
    }

    .description {
        margin: 0 0 20px;
        color: #5c6355;
        font-size: 14px;
        line-height: 1.6 ;
    }

    .price
    {
        display: flex ;
        align-items: baseline;
        flex-wrap: wrap;
        gap: 12px;
        margin-bottom: 20px;
    }
    .price strong {
        color: #181b19;
        font-size: 26px;
    }

    .price s {
        color:#5c6355;
        font-size: 14px;
    }
    
    .size-field {
        margin:0%;
        padding: 0%;
        border: 0;
        min-width: 0%;
        }

    .size-field legend {
        padding: 0%;
        font-weight: bold;
        font-size: 14px;
        margin-bottom: 12px;
    }
    
    * {
        box-sizing: border-box;
    }

    @media (max-width: 480px) {
        body {
            padding: 16px;
        }

        .product-card {
            padding: 20px;
        }

        h1 {
            font-size: 20px;
        }

        .product-image {
            height: 220px;
        }
    }

    .clear-button {
        padding: 10px 14px;
        border: 1px solid #cfd3cd;
        border-radius: 8px;
        background: white;
        font: inherit;
        cursor: pointer;
    }

    .clear-button:hover {
        background: #f0f0ec;
    }
    .store-header {
        margin-bottom: 16px;
    }

    .store-name{
        margin: 0;
        color: #214f39;
        font-size: 28px;
        font-weight: bold;
        letter-spacing: -1px;

    }
</style>
</head>

<body>
        <main>
        <header class="store-header">
            <p class="store-name">WPU</p>
        </header>

        <article class="product-card">
            <img class="product-image" src="sepatu-02-depan-serong.png" alt="Sepasang Adidas Samba putih dengan tiga garis">
            <p class="brand">___ADIDAS ORIGINALS</p>
    <h1>Samba OG Green</h1>
<p class="description">Kulit premium dan suede lembut berpadu dengan 3-Stripes hijau khas Samba. Siluet klasik dengan sol karet yang nyaman dipakai sehari-hari.</p>
<div class="price">
    <Strong>Rp 2.200.000</Strong>
    <s>Rp 2.600.000</s>
</div>

<form id="Product-Form">
    <fieldset class = "size-field">
        <legend>Pilih Ukuran (UK):</legend>
        <div class="sizes">
         <label class="size">
        <input type="radio" name="size" value="8"> <span>8</span>
         </label>
         <label class="size">
        <input type="radio" name="size" value="9" checked> <span>9</span>
         </label>
         <label class="size">
        <input type="radio" name="size" value="10"> <span>10</span>
         </label>
         <label class="size">
        <input type="radio" name="size" value="11"> <span>11</span>
         </label>
         <label class="size">
        <input type="radio" name="size" value="12"> <span>12</span>
         </label>
         </div>
         <button type="submit" class="add-button">TAMBAHKAN KE KERANJANG</button>
         <p id="cart-message" role="status"></p>
         <ul id="cart-list"></ul>
         <button type="button"id="clear-cart" class="clear-button">Kosongkan Keranjang</button>
         <p>Isi keranjang: <strong id="cart-count">0</strong> pasang</p>
         <p>Subtotal: <strong id="cart-total">Rp 0</strong></p>
    </fieldset>
</form>
 </article>
 
 </main>
<script>
  const productPrice = 2200000;
  const productForm = document.getElementById("Product-Form");
  const cartMessage = document.getElementById("cart-message");
  const cartCount = document.getElementById("cart-count");
  const cartTotal = document.getElementById("cart-total");
  const cartList = document.getElementById("cart-list");
  const cart = [];

  productForm.addEventListener("submit", function(event) {
    event.preventDefault();

    const formData = new FormData(productForm);
    const selectedSize = formData.get("size");

    cart.push(selectedSize);
    const cartItem = document.createElement("li");
    cartItem.textContent =
      "Samba OG Green ukuran UK " + selectedSize +
      " - Rp " + productPrice.toLocaleString("id-ID");
    cartList.appendChild(cartItem);
    cartCount.textContent = cart.length;
    const totalPrice = cart.length * productPrice;
    cartTotal.textContent = "Rp " + totalPrice.toLocaleString("id-ID");
    cartMessage.textContent =
      "Samba OG Green ukuran UK " + selectedSize +
      " berhasil ditambahkan.";
  });
  const clearCartButton = document.getElementById("clear-cart")
  clearCartButton.addEventListener("click",function() {
    cart.length = 0
    cartList.replaceChildren();
    cartCount.textContent = '0'
    cartTotal.textContent = '0'
    cartMessage.textContent = 'Keranjang Sudah Dikosongkan'
  });

</script>

</body>
</html>
