<!DOCTYPE html>
<html lang="en">
<head>

    .size {

        grid-template-columns: repeat(5,1fr);

        position: relative;
        cursor: pointer;
    }

    .size input{
        position: absolute;
        width: 1px;
        heig: 1px;
        clipath: inset(50%);
    }
</style>
</head>

<body>
    <main>

<p class="description">Kulit premium dan suede lembut berpadu dengan 3-Stripes hijau khas Samba. Siluet klasik dengan sol karet yang nyaman dipakai sehari-hari.</p>
<div class="price">

</div>

<form id="Product-Form">

</form>
 </article>
 </main>

</html>
