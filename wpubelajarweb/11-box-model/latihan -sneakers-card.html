<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sambak OG Green · Tapak.</title>
<style>
    :root{
        --paper:#f6f6f2;

    }
    body {
        background: var(--paper);
    }

    .size {
        display: grid;
        grid-template-columns: repeat(5,1fr);
        gap: 8px;
        position: relative;
        cursor: pointer;
    }

    .size input{
        position: absolute;
        width: 1px;
        height: 1px;
        clip-path: inset(50%);
    }

    .size span {
        display: block;
        padding: 12px 0;
        text-align: center;
        border: 1px solid #cfd3cd;
        border-radius: 8px;
        background: white;
        color: #181b19;
    }

    .size input:checked + span {
        background: #181b19;
        color: white;
        border-color: #181b19;
    }

    .size input:focus-visible + span {
        outline: 3px solid #284aab;
        outline-offset: 2px;
    }
</style>
</head>

<body>
    <main>
        <article class="product-card">
        <p class="brand">ADIDAS ORIGINALS</p>
    <h1>Samba OG Green</h1>
<p class="description">Kulit premium dan suede lembut berpadu dengan 3-Stripes hijau khas Samba. Siluet klasik dengan sol karet yang nyaman dipakai sehari-hari.</p>
<div class="price">
    <Strong>Rp 2.200.000</Strong>
    <s>Rp 2.600.000</s>
</div>

<form id="Product-Form">
    <fieldset class = "size-field">
        <legend>Pilih Ukuran (UK):</legend>
        <div class="sizes">
         <label class="size">
        <input type="radio" name="size" value="8"> <span>8</span>
         </label>
         <label class="size">
        <input type="radio" name="size" value="9" checked> <span>9</span>
         </label>
         <label class="size">
        <input type="radio" name="size" value="10"> <span>10</span>
         </label>
         <label class="size">
        <input type="radio" name="size" value="11"> <span>11</span>
         </label>
         <label class="size">
        <input type="radio" name="size" value="12"> <span>12</span>
         </label>
         </div>

    </fieldset>
</form>
 </article>
 
 </main>
</body>
</html>
