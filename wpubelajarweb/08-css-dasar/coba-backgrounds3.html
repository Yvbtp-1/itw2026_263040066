
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coba Background </title>
    <style>
        body {
            background-color: lightblue;
            background-image: linear-gradient(to right ,red,blue,green,grey,navy);
            height: 100vh;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

    .kotak1 {
        width: 300px;
        height: 300px;
        background-color: salmon;
        background-image: linear-gradient(circle, #ff0000 , #00ff00 , #0000ff );
    }

    .kotak2 {
        width: 300px;
        height: 300px;
        background-color: coral;
        background-image: radial-gradient(circle, #ff00ff , #ffff00 , #00ffff );
    }

    .kotak3 {
        width: 300px;
        height: 300px;
        background-color: mediumpurple;
        background-image: conic-gradient(
            circle,
            #ff0000 ,
            #00ff00 ,
            #0000ff 
        );
    }
    </style>
</head>
<body>
    <div class="kotak1"></div>
    <div class="kotak2"></div>
    <div class="kotak3"></div>
</body>
</html>
