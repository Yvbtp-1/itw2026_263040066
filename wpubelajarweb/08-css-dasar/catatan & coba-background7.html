<!DOCTYPE html>

<head>

    <style>
        @import url("https://fonts.googleapis.com/css2?family=Tiny5+Duo:ital,wght@0,100..900;1,100..900&display=swap");

        body {
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background-color: #333;
            
        }
        .frame {
            width: 400px;
            height: 400px;
            border: 10px solid white;

            background-color: lightblue;
            border-radius: 30%;
        }
        h1 {
            color: white;
            text-align: center;
            font-family: 'Tiny5 Duo', Courier, monospace;

            text-shadow: 2px 2px 4px black;
        }
