

<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kutipan Filsuf - Styling Teks</title>
    <style>
      @font-face {
        font-family: "Pixelify Sans";
        src: url("fonts/PixelifySans-Bold.ttf") format("truetype");
        font-weight: 700;
        font-style: normal;
        font-display: swap;
      }

      /* ====== ISI URL GAMBAR DI SINI ====== */
      :root {
        --img-marcus: url("Marcus\ Aurelius\ –\ The\ Philosopher\ King.jpg");
        --img-seneca: url("Seneca.jpg");
        --img-kerajaan-kiri: url("Kerajaan\ Yunani\ KIri.jpeg");
        --img-kerajaan-kanan: url("Kerajaan\ Yunani\ kanan.jpeg");

        --opasitas-gambar: 0.75;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: clamp(32px, 8vw, 88px) 24px;
        min-height: 100vh;
        min-height: 100dvh;
        background-color: #101729;
        background-image:
          radial-gradient(ellipse at 12% 18%, rgb(91 112 202 / 32%), transparent 38%),
          radial-gradient(ellipse at 88% 82%, rgb(190 116 89 / 20%), transparent 36%),
          linear-gradient(135deg, #101729, #1d2940 55%, #172033);
        background-attachment: fixed;
        color: #f5efe5;
        font-family: Georgia, "Times New Roman", serif;
        line-height: 1.8;
        overflow-x: hidden;
      }

      /* ====== LAYER LATAR YUNANI (lingkaran hitam) ====== */
      .latar-yunani {
        position: fixed;
        z-index: 0;
        pointer-events: none;
        background-repeat: no-repeat;
        background-size: cover;
        background-position: center;
        opacity: var(--opasitas-gambar);
        -webkit-mask-image: radial-gradient(ellipse at center, #000 35%, transparent 72%);
        mask-image: radial-gradient(ellipse at center, #000 35%, transparent 72%);
      }

      .latar-yunani--kiri {
        left: 0;
        bottom: 0;
        width: min(42vw, 520px);
        height: min(48vh, 420px);
        background-image: var(--img-kerajaan-kiri);
      }

      .latar-yunani--kanan {
        right: 0;
        top: 38%;
        width: min(42vw, 520px);
        height: min(52vh, 460px);
        background-image: var(--img-kerajaan-kanan);
      }

      main {
        position: relative;
        z-index: 1;
      }

      h1 {
        text-align: center;
        margin: 0 0 48px;
        color: #f4c985;
        font-family: "Pixelify Sans", Georgia, serif;
        font-size: clamp(2.4rem, 7vw, 4.5rem);
        font-weight: 700;
        letter-spacing: 0.03em;
        text-shadow: 0 4px 24px rgb(244 201 133 / 22%);
      }

      /* ====== KARTU KUTIPAN (grid: teks | potret) ====== */
      .kutipan {
        max-width: 760px;
        margin: 0 auto;
      }

      .kutipan + .kutipan {
        margin-top: 40px;
      }

      .kartu {
        display: grid;
        grid-template-columns: minmax(0, 1fr) clamp(150px, 26vw, 210px);
        overflow: hidden;
        border: 1px solid rgb(244 201 133 / 28%);
        border-radius: 20px;
        background:
          linear-gradient(135deg, rgb(255 255 255 / 8%), rgb(255 255 255 / 2%)),
          rgb(22 32 51 / 72%);
        box-shadow: 0 20px 55px rgb(0 0 0 / 24%);
      }

      .kartu p {
        margin: 0;
        padding: clamp(24px, 5vw, 40px);
        color: #f5efe5;
        font-size: clamp(1.2rem, 3vw, 1.65rem);
        font-style: italic;
        line-height: 1.9;
        text-align: left;
        text-wrap: pretty;
      }

      /* ====== POTRET TOKOH (lingkaran putih) ====== */
      .tokoh {
        background-repeat: no-repeat;
        background-size: cover;
        background-position: center top;
        opacity: var(--opasitas-gambar);
        -webkit-mask-image: linear-gradient(to right, transparent 0%, #000 35%);
        mask-image: linear-gradient(to right, transparent 0%, #000 35%);
      }

      .tokoh--marcus {
        background-image: var(--img-marcus);
      }

      .tokoh--seneca {
        background-image: var(--img-seneca);
      }

      .highlight {
        color: #f4c985;
        text-decoration: underline wavy #d99a72;
        text-decoration-thickness: 2px;
        text-underline-offset: 5px;
      }

      .quote-kedua {
        letter-spacing: 0.02em;
      }

      .Qute-2 {
        color: #f4c985;
        text-decoration: underline;
        text-decoration-color: #d99a72;
        text-underline-offset: 4px;
      }

      cite {
        display: block;
        margin: 14px 0 0;
        color: #c9d2e1;
        font-size: 0.95rem;
        font-style: normal;
        letter-spacing: 0.08em;
        text-align: right;
        text-transform: uppercase;
      }

      /* ====== MOBILE: potret pindah ke atas teks ====== */
      @media (max-width: 560px) {
        h1 {
          margin-bottom: 32px;
        }

        .kutipan + .kutipan {
          margin-top: 32px;
        }

        .kartu {
          grid-template-columns: 1fr;
        }

        .tokoh {
          order: -1;
          height: 160px;
          -webkit-mask-image: linear-gradient(to bottom, #000 40%, transparent 100%);
          mask-image: linear-gradient(to bottom, #000 40%, transparent 100%);
        }

        .latar-yunani--kiri,
        .latar-yunani--kanan {
          width: 60vw;
          height: 28vh;
        }
      }
    </style>
  </head>
  <body>
    <div class="latar-yunani latar-yunani--kiri" aria-hidden="true"></div>
    <div class="latar-yunani latar-yunani--kanan" aria-hidden="true"></div>

    <main>
      <h1>Quote Filsuf 🏛️</h1>

      <figure class="kutipan" style="margin-inline: auto">
        <div class="kartu">
          <p>
            “Kebahagiaan hidupmu bergantung pada kualitas
            <span class="highlight"><strong>pikiranmu</strong></span>.”
          </p>
          <div class="tokoh tokoh--marcus" role="img" aria-label="Potret Marcus Aurelius"></div>
        </div>
        <cite><strong>— Marcus Aurelius</strong></cite>
      </figure>

      <figure class="kutipan" style="margin-inline: auto">
        <div class="kartu">
          <p class="quote-kedua">
            “Bukan karena kita memiliki sedikit
            <span class="Qute-2"><strong>waktu</strong></span>, tetapi karena kita
            kehilangan banyak <span class="Qute-2"><strong>waktu</strong></span>.”
          </p>
          <div class="tokoh tokoh--seneca" role="img" aria-label="Potret Seneca"></div>
        </div>
        <cite><strong>— Seneca</strong></cite>
      </figure>
    </main>
  </body>
</html>
