<!--
  CATATAN CSS: TEXT

  1. TEXT FORMATTING

    text-align      Mengatur perataan teks.
      Ada left (kiri) ,right (Kanan),center (Tengah),justify (Rata Kanan Kiri)

    text-decoration Mengatur garis dekorasi pada teks.
    text-decoration-line
      none (tidak ada garis),
      underline (Garis dibawah Teks)
      overline (Garis diatas Teks)
      line-through (Garis ditengah Teks),
      underline overline (Garis diatas dan dibawah Teks),
      underline line-through (Garis dibawah dan ditengah Teks)
      grammar-error,spelling error (Kesalahan spelling pada Teks)

    text-decoration-color Mengatur warna garis dekorasi pada teks.
      px,em.rem

    text-decoration-style Mengatur gaya garis dekorasi pada teks.
      solid (garis lurus),dotted(garis putus putus),dashed (titik),wavy(garis melengkung),

    text-decoration-color
      color name,hex,rgb

    text-decoration-skip-ink

    text-transform  Mengubah teks menjadi huruf besar, kecil, atau kapital.

    Contoh:
    p {
      text-align: center;
      text-decoration: underline;
      text-transform: uppercase;
    }

  2. TEXT SPACING

    text-indent    Mengatur indentasi baris pertama paragraf.
    letter-spacing Mengatur jarak antarhuruf.
    word-spacing   Mengatur jarak antarkata.
    white-space    Mengatur cara browser menampilkan spasi dan baris baru.

  3. TEXT EFFECTS

    text-overflow Mengatur tampilan teks yang melampaui batas container.
      Biasanya digunakan bersama overflow dan white-space.
    text-shadow   Memberikan efek bayangan pada teks.
-->
